# ARM user-mode emulation needs an explicit runner for test subprocesses too.
# QEMU_LD_PREFIX is inherited from cross's linux-runner wrapper.
[target.armv7-unknown-linux-gnueabihf.env]
passthrough = ["ZENBENCH_AFFINITY_TEST_RUNNER=qemu-arm"]

[build.env]
# cross can expose a read-only HOME. Keep the real cross-process lock in the
# writable target mount shared by the test executables; do not disable locking.
passthrough = ["ZENBENCH_CPU_POLICY", "XDG_CACHE_HOME=/target/zenbench-ci-cache", "TMPDIR=/target"]
